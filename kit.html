<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0B0D" />
  <title>The Kit — Urge Intensesports CS2</title>
  <meta name="description" content="The official Urge Intensesports CS2 player kit in interactive 3D." />

  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    .kit-page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      position: relative;
      z-index: 2;
    }
    .kit-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 1.25rem clamp(1rem, 4vw, 3rem);
    }
    .kit-top a.kit-back {
      display: inline-flex; align-items: center; gap: .55rem;
      font-family: var(--f-head); font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; font-size: .9rem; color: var(--muted);
      transition: color .2s var(--ease);
    }
    .kit-top a.kit-back:hover { color: var(--text); }
    .kit-top .kit-wordmark { font-family: var(--f-display); font-size: 1.5rem; letter-spacing: .06em; }
    .kit-top .kit-wordmark em { color: var(--green); font-style: normal; }

    .kit-stage {
      position: relative;
      display: grid;
      place-items: center;
      padding: 0 1rem;
    }
    /* fit the whole jersey on one screen, whatever the window shape */
    .kit-stage .kitfx__card { width: min(92vw, 760px, 66vh); }
    .kit-stage .kitfx__card { width: min(92vw, 760px, 66svh); }
    .kit-bottom { padding: 1rem clamp(1rem, 4vw, 3rem) 2rem; text-align: center; }
    .kit-bottom h1 { font-family: var(--f-display); font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: .92; letter-spacing: .02em; }
    .kit-bottom h1 .accent { color: var(--green); }
    .kit-bottom p { color: var(--muted); max-width: 46ch; margin: .6rem auto 1.2rem; }
    .kit-hint { display:inline-flex; align-items:center; gap:.5rem; font-family: var(--f-head); font-weight:600; letter-spacing:.12em; text-transform:uppercase; font-size:.72rem; color: var(--muted-d); }
    .kit-hint svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>

  <div class="kit-page">
    <header class="kit-top">
      <a href="index.html" class="kit-back" aria-label="Back to home">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </a>
      <span class="kit-wordmark">URGE <em>INTENSESPORTS</em></span>
      <span style="width:64px" aria-hidden="true"></span>
    </header>

    <section class="kit-stage">
      <div class="kitfx" id="kitShowcase">
        <div class="kitfx__glow" aria-hidden="true"></div>
        <div class="kitfx__card" id="kitCard">
          <div class="kitfx__face kitfx__face--front">
            <picture>
              <source srcset="assets/kit/kit_front.webp" type="image/webp" />
              <img src="assets/kit/kit_front.jpg" alt="Urge Intensesports 2026 match jersey, front" decoding="async" />
            </picture>
            <span class="kitfx__shine" aria-hidden="true"></span>
          </div>
          <div class="kitfx__face kitfx__face--back">
            <picture>
              <source srcset="assets/kit/kit_back.webp" type="image/webp" />
              <img src="assets/kit/kit_back.jpg" alt="Urge Intensesports 2026 match jersey, back — BONDENCS, number 22" decoding="async" />
            </picture>
            <span class="kitfx__shine" aria-hidden="true"></span>
          </div>
        </div>
        <div class="kitfx__toggle" role="group" aria-label="Show jersey side">
          <button type="button" data-face="front" class="is-active">Front</button>
          <button type="button" data-face="back">Back</button>
        </div>
      </div>
    </section>

    <footer class="kit-bottom">
      <h1>THE <span class="accent">2026 KIT</span></h1>
      <p>Official player jersey — engineered for the clutch. Flip it, tilt it, take it in.</p>
      <span class="kit-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg>
        Hover to tilt · click to flip
      </span>
    </footer>
  </div>

  <script src="js/kit-showcase.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
